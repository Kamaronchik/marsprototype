<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Exo+2:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Mars Space</title>
    <!-- Puts the chosen style on the page before it is drawn, so there is no flash of the wrong one. -->
    <script>
      try {
        var style = localStorage.getItem('mars-theme');
        if (['mars', 'orbit', 'terminal'].indexOf(style) > -1) document.documentElement.setAttribute('data-theme', style);
      } catch (error) { /* private mode: the default style is used */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
